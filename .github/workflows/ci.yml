name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-pack:
    # The runner account cannot write the system SDK directory; keep CI SDKs isolated per run.
    env:
      DOTNET_INSTALL_DIR: /home/lancer1977/actions-runner/core-models/_work/_tool/dotnet
    # This public repository runs unreviewed pull-request code nowhere on the self-hosted runner.
    # Validation executes only for trusted main-branch pushes or a maintainer-triggered dispatch.
    runs-on: [self-hosted, Linux, X64, core-models-validation]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore PolyhydraGames.Core.Models.sln
      - name: Build
        run: dotnet build PolyhydraGames.Core.Models.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test PolyhydraGames.Core.Models.sln --configuration Release --no-build
      - name: Pack
        run: dotnet pack Models/PolyhydraGames.Core.Models.csproj --configuration Release --no-build --output artifacts/packages
