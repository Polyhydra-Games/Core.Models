name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-models-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PACKAGE_VERSION: 3.0.0.${{ github.run_number }}

jobs:
  test:
    name: Build, test, and measure coverage
    # Keep trusted validation on the registered repository validation runner.
    # Fork pull requests do not receive this host or its private-network access.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","core-models-validation"]') || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Tests/PolyhydraGames.Core.Models.Test.csproj

      - name: Build
        run: dotnet build Tests/PolyhydraGames.Core.Models.Test.csproj --configuration Release --no-restore

      - name: Build all library target frameworks
        run: dotnet build PolyhydraGames.Core.Models.sln --configuration Release --no-restore

      - name: Test with coverage
        run: dotnet test Tests/PolyhydraGames.Core.Models.Test.csproj --configuration Release --no-build --no-restore --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Enforce baseline line coverage
        run: python3 scripts/summarize-coverage.py TestResults --min-line 77

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-models-coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

  pack:
    name: Pack ${{ matrix.name }}
    needs: test
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","core-models-validation"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core-models
            project: Models/PolyhydraGames.Core.Models.csproj
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack
        run: dotnet pack ${{ matrix.project }} --configuration Release -p:PackageVersion=${PACKAGE_VERSION} --output artifacts/packages

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nuget-packages-${{ matrix.name }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish to nuget.org
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: pack
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: nuget-packages-*
          path: artifacts/packages
          merge-multiple: true

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push packages
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
