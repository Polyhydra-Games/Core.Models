name: Publish NuGet package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: core-models-publish-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PACKAGE_VERSION: 2.0.0.${{ github.run_number }}
jobs:
  build:
    name: Test and pack
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor == github.repository_owner &&
       github.event.pull_request.user.login == github.repository_owner &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, core-models-ci]
    env:
      TMPDIR: ${{ github.workspace }}/.runner-temp
      TMP: ${{ github.workspace }}/.runner-temp
      TEMP: ${{ github.workspace }}/.runner-temp
      DOTNET_ROOT: ${{ github.workspace }}/.dotnet
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout Core.Models
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Prepare isolated tool directories
        run: mkdir -p "$TMPDIR" "$DOTNET_ROOT" "$NUGET_PACKAGES"

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Tests/PolyhydraGames.Core.Models.Test.csproj

      - name: Test
        run: dotnet test Tests/PolyhydraGames.Core.Models.Test.csproj --no-restore --configuration Release

      - name: Pack
        run: dotnet pack Models/PolyhydraGames.Core.Models.csproj --no-restore --configuration Release -p:PackageVersion=${{ env.PACKAGE_VERSION }} --output artifacts/packages

      - name: Clean isolated tool directories
        if: always()
        run: rm -rf "$TMPDIR" "$DOTNET_ROOT" "${NUGET_PACKAGES%/packages}"

  publish:
    name: Publish verified package
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: [self-hosted, Linux, X64, core-models-ci]
    environment: nuget-release
    permissions:
      contents: read
      packages: write
    env:
      TMPDIR: ${{ github.workspace }}/.runner-temp
      TMP: ${{ github.workspace }}/.runner-temp
      TEMP: ${{ github.workspace }}/.runner-temp
      DOTNET_ROOT: ${{ github.workspace }}/.dotnet
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - name: Checkout Core.Models
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Prepare isolated tool directories
        run: mkdir -p "$TMPDIR" "$DOTNET_ROOT" "$NUGET_PACKAGES"

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore, test, and pack release commit
        run: |
          dotnet restore Tests/PolyhydraGames.Core.Models.Test.csproj
          dotnet test Tests/PolyhydraGames.Core.Models.Test.csproj --no-restore --configuration Release
          dotnet pack Models/PolyhydraGames.Core.Models.csproj --no-restore --configuration Release -p:PackageVersion=${{ env.PACKAGE_VERSION }} --output artifacts/packages

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$GITHUB_TOKEN"
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "$GITHUB_TOKEN" --skip-duplicate
          done

      - name: Publish to nuget.polyhydragames.com
        env:
          BAGET_API_KEY: ${{ secrets.BAGET_API_KEY }}
        run: |
          test -n "$BAGET_API_KEY"
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" --source "https://nuget.polyhydragames.com/v3/index.json" --api-key "$BAGET_API_KEY" --skip-duplicate
          done

      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          test -n "$NUGET_API_KEY"
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          done

      - name: Clean isolated tool directories
        if: always()
        run: rm -rf "$TMPDIR" "$DOTNET_ROOT" "${NUGET_PACKAGES%/packages}"
