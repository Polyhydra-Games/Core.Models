name: Publish NuGet package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PACKAGE_VERSION: 1.0.2.${{ github.run_number }}
  NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

jobs:
  publish:
    name: Test, pack, and publish
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Core.Models
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Tests/PolyhydraGames.Core.Models.Test.csproj

      - name: Test
        run: dotnet test Tests/PolyhydraGames.Core.Models.Test.csproj --no-restore --configuration Release

      - name: Pack
        run: dotnet pack Models/PolyhydraGames.Core.Models.csproj --no-restore --configuration Release -p:PackageVersion=${{ env.PACKAGE_VERSION }} --output artifacts/packages

      - name: Publish to GitHub Packages
        if: github.event_name != 'pull_request'
        run: |
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
          done

      - name: Require NuGet publish secret on main
        if: github.event_name != 'pull_request' && env.NUGET_API_KEY == ''
        run: |
          echo "::error::NUGET_API_KEY is not configured, so the package cannot be published to nuget.org from this workflow."
          exit 1

      - name: Publish to nuget.org
        if: github.event_name != 'pull_request' && env.NUGET_API_KEY != ''
        run: |
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          done
