name: Publish NuGet package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE_VERSION: 1.0.2.${{ github.run_number }}
  NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

jobs:
  publish:
    name: Test, pack, and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Core.Models
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Tests/PolyhydraGames.Core.Models.Test.csproj

      - name: Test
        run: dotnet test Tests/PolyhydraGames.Core.Models.Test.csproj --no-restore --configuration Release

      - name: Pack
        run: dotnet pack Models/PolyhydraGames.Core.Models.csproj --no-restore --configuration Release -p:PackageVersion=${{ env.PACKAGE_VERSION }} --output artifacts/packages

      - name: Publish to nuget.org
        if: github.event_name != 'pull_request' && env.NUGET_API_KEY != ''
        run: dotnet nuget push "artifacts/packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

      - name: NuGet publish secret missing
        if: github.event_name != 'pull_request' && env.NUGET_API_KEY == ''
        run: echo "::warning::NUGET_API_KEY is not configured, so the package was packed but not published."
