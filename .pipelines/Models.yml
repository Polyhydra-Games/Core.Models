# Core Models pipeline
name: 1.0.1.$(rev:r)
variables: 
- name: ModelsSolution
  value: PolyhydraGames.Core.Models.sln
- name: ModelsProject
  value: Models/PolyhydraGames.Core.Models.csproj
- name: ModelsTests
  value: Tests/PolyhydraGames.Core.Models.Test.csproj
- name: BuildConfiguration
  value: Release

trigger:
  branches:
    include:
    - refs/heads/main
  paths:
    include:
    - Models
    - Tests
jobs:
- job: Phase_1 
  cancelTimeoutInMinutes: 5
  pool:
    name: Default
  steps:
  - checkout: self
  - task: DotNetCoreCLI@2
    displayName: dotnet restore
    inputs:
      command: restore
      projects: '$(ModelsSolution)'
  - task: DotNetCoreCLI@2
    displayName: dotnet build
    inputs:
      command: build
      projects: '$(ModelsSolution)'
      arguments: '--configuration $(BuildConfiguration) --no-restore'
  - task: DotNetCoreCLI@2
    displayName: dotnet test
    inputs:
      command: test
      projects: '$(ModelsTests)'
      arguments: '--configuration $(BuildConfiguration) --no-restore'
  - task: DotNetCoreCLI@2
    displayName: dotnet pack
    inputs:
      command: pack
      packagesToPack: '$(ModelsProject)'
      versioningScheme: byBuildNumber
      arguments: '--configuration $(BuildConfiguration) --no-restore --include-source --include-symbols'
  - task: NuGetCommand@2
    displayName: Poly NuGet push
    inputs:
      command: push
      packagesToPush: '$(Build.ArtifactStagingDirectory)/**/*.nupkg;!$(Build.ArtifactStagingDirectory)/**/*.symbols.nupkg'
      feedPublish: 015fc12f-cd63-4ab4-8d6a-dc889e53bf70
      allowPackageConflicts: false
  - task: NuGetCommand@2
    displayName: NuGet.org push
    inputs:
      command: 'push'
      packagesToPush: '$(Build.ArtifactStagingDirectory)/**/*.nupkg;!$(Build.ArtifactStagingDirectory)/**/*.symbols.nupkg'
      nuGetFeedType: 'external'
      publishFeedCredentials: 'Nuget Org'
